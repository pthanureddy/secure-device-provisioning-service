name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Static analysis
        run: go vet ./...
      - name: Race detector
        run: go test -race ./...
      - name: Tests and internal package coverage
        run: go test -coverpkg=./internal/... -coverprofile=coverage.out ./internal/...
      - name: Coverage report
        run: |
          go tool cover -func=coverage.out
          total=$(go tool cover -func=coverage.out | awk '/total:/{gsub("%","",$3); print $3}')
          awk -v total="$total" 'BEGIN { if (total < 75) exit 1 }'
      - name: Build binaries
        run: |
          go build ./cmd/controlplane
          go build ./cmd/device-simulator
      - name: Validate deployment descriptors
        run: |
          python -m pip install PyYAML==6.0.3
          python scripts/validate_deploy.py

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: secure-device-provisioning-service:ci

